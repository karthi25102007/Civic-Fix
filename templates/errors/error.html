{% extends 'base.html' %}

{% block title %}Access denied — CivicFix{% endblock %}
{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="container content-page">
    <div class="card card-pad" style="max-width:640px;margin:40px auto;text-align:center">
        <div style="font-size:64px;font-weight:800;color:var(--primary);letter-spacing:-.05em">{{ code }}</div>
        <h2>{{ title }}</h2>
        <p class="text-muted mt-2">{{ message }}</p>
        <div class="mt-3"><a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to home</a></div>
    </div>
</div>
{% endblock %}
